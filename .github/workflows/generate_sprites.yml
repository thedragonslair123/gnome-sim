name: Generate Sprite Sheets

on:
  push:
    branches: [ main ]

jobs:
  generate:
    name: Generate sprite sheets (1x/2x/3x/4x)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Generate gnome sheets
        run: |
          python3 scripts/generate_spritesheet.py gnome 1 2 3 4

      - name: Generate oldwoman sheets
        run: |
          python3 scripts/generate_spritesheet.py oldwoman 1 2 3 4

      - name: Commit and push generated assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/gnome_sheet* assets/gnome_frame_* assets/gnome_sprites_generated* assets/oldwoman_sheet* assets/oldwoman_frame_* assets/oldwoman_sprites_generated* || true
          git commit -m "CI: Regenerate sprite sheets (@1x,@2x,@3x,@4x)" || echo "No changes to commit"
          git push
